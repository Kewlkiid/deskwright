<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Acme Docs search</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #111; }
  header { background: #0f172a; color: #fff; padding: 16px 32px; font-weight: 600; }
  main { max-width: 760px; margin: 32px auto; padding: 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  ol { padding-left: 20px; } li { margin: 14px 0; } li a { font-weight: 600; } li p { margin: 2px 0 0; color: #475569; }
</style>
</head>
<body>
<header>Acme Docs</header>
<main>
  <form id="search-form"><label for="q" hidden>Search</label><input id="q" placeholder="Search the docs"><button id="go">Search</button></form>
  <p id="count"></p>
  <ol id="results"></ol>
</main>
<script>
  document.getElementById("search-form").onsubmit = async (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value.trim();
    if (!q) return;
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await r.json();
    document.getElementById("count").textContent = `${data.results.length} results for "${data.query}"`;
    document.getElementById("results").innerHTML = data.results.map((x) =>
      `<li><a href="${x.url}">${x.title}</a><p>${x.snippet}</p></li>`).join("");
  };
</script>
</body>
</html>
